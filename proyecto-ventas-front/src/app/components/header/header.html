<mat-toolbar color="primary" class="header-toolbar">

  <!-- Logo -->
  <a routerLink="/" class="logo">
    <mat-icon class="logo-icon">inventory_2</mat-icon>
    <span class="logo-text">SistemaVentas</span>
  </a>

  <!-- Menú de navegación (autenticado y no en login) -->
  <nav class="nav" *ngIf="estaAutenticado() && !enLogin()">

    <!-- ADMINISTRADOR -->
    <ng-container *ngIf="esAdmin">

      <!-- Enlaces principales (siempre visibles) -->
      <a mat-button routerLink="/admin/dashboard" routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </a>
      <a mat-button routerLink="/admin/articulos" routerLinkActive="active-link">
        <mat-icon>inventory_2</mat-icon>
        Artículos
      </a>
      <a mat-button routerLink="/admin/usuarios" routerLinkActive="active-link">
        <mat-icon>people</mat-icon>
        Usuarios
      </a>

      <!-- Menú: Catálogos -->
      <button mat-button [matMenuTriggerFor]="menuCatalogos" class="menu-btn">
        <mat-icon>category</mat-icon>
        Catálogos
        <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
      </button>
      <mat-menu #menuCatalogos="matMenu">
        <button mat-menu-item routerLink="/admin/departamentos">
          <mat-icon>business_center</mat-icon>
          <span>Departamentos</span>
        </button>
        <button mat-menu-item routerLink="/admin/sucursales">
          <mat-icon>business</mat-icon>
          <span>Sucursales</span>
        </button>
        <button mat-menu-item routerLink="/admin/rubros">
          <mat-icon>category</mat-icon>
          <span>Rubros</span>
        </button>
        <button mat-menu-item routerLink="/admin/proveedores">
          <mat-icon>local_shipping</mat-icon>
          <span>Proveedores</span>
        </button>
        <button mat-menu-item routerLink="/admin/tipos-orden">
          <mat-icon>assignment_turned_in</mat-icon>
          <span>Tipos de Orden</span>
        </button>
      </mat-menu>

      <!-- Menú: Compras -->
      <button mat-button [matMenuTriggerFor]="menuCompras" class="menu-btn">
        <mat-icon>shopping_cart</mat-icon>
        Compras
        <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
      </button>
      <mat-menu #menuCompras="matMenu">
        <button mat-menu-item routerLink="/admin/adjudicaciones">
          <mat-icon>gavel</mat-icon>
          <span>Adjudicaciones</span>
        </button>
        <button mat-menu-item routerLink="/admin/pedidos-internos">
          <mat-icon>assignment</mat-icon>
          <span>Pedidos Internos</span>
        </button>
      </mat-menu>

      <!-- Menú: Admin -->
      <button mat-button [matMenuTriggerFor]="menuAdmin" class="menu-btn">
        <mat-icon>admin_panel_settings</mat-icon>
        Admin
        <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
      </button>
      <mat-menu #menuAdmin="matMenu">
        <button mat-menu-item routerLink="/admin/roles">
          <mat-icon>badge</mat-icon>
          <span>Roles</span>
        </button>
        <button mat-menu-item routerLink="/admin/reportes">
          <mat-icon>analytics</mat-icon>
          <span>Reportes</span>
        </button>
      </mat-menu>

    </ng-container>

    <!-- EMPLEADO -->
    <ng-container *ngIf="esEmpleado">
      <a mat-button routerLink="/empleado/pedidos" routerLinkActive="active-link">
        <mat-icon>assignment</mat-icon>
        Pedidos
      </a>
      <a mat-button routerLink="/empleado/articulos" routerLinkActive="active-link">
        <mat-icon>inventory_2</mat-icon>
        Artículos
      </a>
    </ng-container>

    <!-- PROVEEDOR -->
    <ng-container *ngIf="esProveedor">
      <a mat-button routerLink="/proveedor/ofertas" routerLinkActive="active-link">
        <mat-icon>local_offer</mat-icon>
        Mis Ofertas
      </a>
      <a mat-button routerLink="/proveedor/articulos" routerLinkActive="active-link">
        <mat-icon>inventory_2</mat-icon>
        Artículos
      </a>
    </ng-container>
  </nav>

  <!-- Espaciador -->
  <span class="spacer"></span>

  <!-- Usuario (autenticado y no en login) -->
  <div class="user-section" *ngIf="estaAutenticado() && !enLogin()">
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <div class="avatar">{{ iniciales }}</div>
      <div class="user-info">
        <span class="user-name">{{ usuario()?.nombre }}</span>
        <span class="user-role">{{ nombreRol }}</span>
      </div>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="menu-header">
        <div class="avatar-large">{{ iniciales }}</div>
        <div class="menu-user-info">
          <strong>{{ usuario()?.nombre }}</strong>
          <span>{{ usuario()?.email }}</span>
          <span class="menu-role">{{ nombreRol }}</span>
        </div>
      </div>
      <mat-divider></mat-divider>

      <button mat-menu-item routerLink="/perfil">
        <mat-icon>person</mat-icon>
        <span>Mi Perfil</span>
      </button>

      <mat-divider></mat-divider>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>

</mat-toolbar>
