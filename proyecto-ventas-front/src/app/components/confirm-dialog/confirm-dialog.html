<div class="confirm-dialog">
  <div class="dialog-header">
    <mat-icon [color]="data.color || 'warn'" class="dialog-icon">
      {{ data.icono || 'warning' }}
    </mat-icon>
    <h2 mat-dialog-title>{{ data.titulo }}</h2>
  </div>

  <mat-dialog-content>
    <p>{{ data.mensaje }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancelar()">
      {{ data.textoCancelar || 'Cancelar' }}
    </button>
    <button mat-raised-button
            [color]="data.color || 'warn'"
            (click)="onConfirmar()"
            cdkFocusInitial>
      {{ data.textoConfirmar || 'Aceptar' }}
    </button>
  </mat-dialog-actions>
</div>
