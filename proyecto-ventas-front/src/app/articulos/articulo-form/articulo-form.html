<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Artículo' : 'Nuevo Artículo' }}</h2>
      <button class="close-btn" (click)="onCancelar()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input id="nombre"
               type="text"
               formControlName="nombre"
               placeholder="Ej: Computadora portátil"
               [class.error]="form.get('nombre')?.invalid && form.get('nombre')?.touched" />
        <span *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="field-error">
          El nombre es obligatorio
        </span>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción *</label>
        <textarea id="descripcion"
                  formControlName="descripcion"
                  rows="3"
                  placeholder="Ej: Laptop para trabajo administrativo"
                  [class.error]="form.get('descripcion')?.invalid && form.get('descripcion')?.touched"></textarea>
        <span *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched" class="field-error">
          La descripción es obligatoria
        </span>
      </div>

      <p *ngIf="error" class="error-message">{{ error }}</p>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="form.invalid || guardando">
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
