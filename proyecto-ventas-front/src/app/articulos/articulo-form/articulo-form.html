<div class="modal-overlay">
  <div class="modal-content">

    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Artículo' : 'Nuevo Artículo' }}</h2>
      <button mat-icon-button (click)="onCancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="modal-body">
        <!-- Código -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Código</mat-label>
          <input matInput formControlName="codigo" readonly>
          <mat-hint>Generado automáticamente</mat-hint>
        </mat-form-field>

        <!-- Nombre -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" placeholder="Ej. Laptop HP">
          <mat-icon matPrefix>inventory_2</mat-icon>
        </mat-form-field>

        <!-- Descripción -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="descripcion" rows="3"></textarea>
        </mat-form-field>

        <!-- Unidad de medida -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Unidad de medida</mat-label>
          <mat-select formControlName="unidad_medida">
            <mat-option *ngFor="let u of unidadesMedida" [value]="u.nombre">
              {{ u.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- ✅ Categoría (Rubro) -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Categoría (Rubro)</mat-label>
          <mat-select formControlName="id_Rubro">
            <mat-option [value]="null">Sin Categoría</mat-option>
            <mat-option *ngFor="let r of rubros" [value]="r.id">
              {{ r.nombre }}
            </mat-option>
          </mat-select>
          <mat-icon matPrefix>category</mat-icon>
        </mat-form-field>
      </div>

      <div class="modal-footer">
        <button mat-button type="button" (click)="onCancel()" [disabled]="guardando">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>{{ esEdicion ? 'save' : 'add' }}</mat-icon>
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
