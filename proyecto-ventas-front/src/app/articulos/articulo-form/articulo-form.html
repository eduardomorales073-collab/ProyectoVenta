<div class="modal-overlay">
  <div class="modal-content">

    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Artículo' : 'Nuevo Artículo' }}</h2>
      <button mat-icon-button (click)="onCancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="modal-body">
        <!-- Código -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Código</mat-label>
          <input matInput formControlName="codigo" placeholder="Ej: TEC-001">
          <mat-hint>Puedes editarlo o se actualizará al elegir la categoría</mat-hint>
        </mat-form-field>

        <!-- Nombre -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" placeholder="Ej. Laptop HP">
          <mat-icon matPrefix>inventory_2</mat-icon>
        </mat-form-field>

        <!-- Descripción -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="descripcion" rows="3"></textarea>
        </mat-form-field>

        <!-- Unidad de medida -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Unidad de medida</mat-label>
          <mat-select formControlName="unidad_medida">
            <mat-option *ngFor="let u of unidadesMedida" [value]="u.nombre">
              {{ u.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- ✅ DASHBOARD DE RUBROS -->
        <div class="rubro-dashboard">
          <label class="dashboard-label">Selecciona una Categoría (Rubro)</label>
          <div class="rubro-grid">

            <!-- Tarjeta: Sin Categoría (Solo para Admin/Gestor) -->
            <mat-card *ngIf="!esProveedor"
                      class="rubro-card"
                      [class.selected]="form.get('id_Rubro')?.value === null"
                      (click)="seleccionarRubro(null)">
              <mat-icon class="rubro-icon">remove_circle_outline</mat-icon>
              <span class="rubro-nombre">Sin Categoría</span>
            </mat-card>

            <!-- Tarjetas de Rubros Dinámicas -->
            <mat-card *ngFor="let r of rubros"
                      class="rubro-card"
                      [class.selected]="form.get('id_Rubro')?.value === r.id"
                      (click)="seleccionarRubro(r.id)">

              <mat-icon class="rubro-icon">{{ getIconoRubro(r.nombre) }}</mat-icon>
              <span class="rubro-nombre">{{ r.nombre }}</span>
              <span class="rubro-prefijo" *ngIf="getPrefijoRubro(r.id)">
                {{ getPrefijoRubro(r.id) }}
              </span>
            </mat-card>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button mat-button type="button" (click)="onCancel()" [disabled]="guardando">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>{{ esEdicion ? 'save' : 'add' }}</mat-icon>
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
