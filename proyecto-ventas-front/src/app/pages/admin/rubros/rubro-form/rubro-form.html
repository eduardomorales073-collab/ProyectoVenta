<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Rubro' : 'Nuevo Rubro' }}</h2>
      <button mat-icon-button (click)="onCancelar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej: Electrónica" required>
        <mat-icon matPrefix>category</mat-icon>
        <mat-error *ngIf="form.get('nombre')?.hasError('required')">
          El nombre es obligatorio
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion" rows="3"
                  placeholder="Ej: Productos electrónicos" required></textarea>
        <mat-icon matPrefix>description</mat-icon>
        <mat-error *ngIf="form.get('descripcion')?.hasError('required')">
          La descripción es obligatoria
        </mat-error>
      </mat-form-field>

      <div class="modal-actions">
        <button mat-button type="button" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>{{ esEdicion ? 'save' : 'add' }}</mat-icon>
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
