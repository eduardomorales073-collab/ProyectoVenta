<div class="container">
  <div class="header-actions">
    <h2>Lista de Proveedores</h2>
    <button mat-raised-button color="primary" (click)="abrirFormulario(null)">
      <mat-icon>add</mat-icon>
      Nuevo Proveedor
    </button>
  </div>

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar proveedor</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="NIT, nombre, teléfono, dirección...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" matSort class="tabla-mat">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let p">{{ p.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>NIT</th>
        <td mat-cell *matCellDef="let p">
          <mat-chip class="chip-nit" *ngIf="p.nit; else sinNit">
            {{ p.nit }}
          </mat-chip>
          <ng-template #sinNit><span class="sin-dato">—</span></ng-template>
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Categoría</th>
        <td mat-cell *matCellDef="let p">
          <span class="categoria-badge" *ngIf="p.categoria; else sinCat">
            {{ p.categoria }}
          </span>
          <ng-template #sinCat><span class="sin-dato">—</span></ng-template>
        </td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let p">{{ p.telefono || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let p">{{ p.direccion || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="rubros">
        <th mat-header-cell *matHeaderCellDef>Rubros</th>
        <td mat-cell *matCellDef="let p">
          <mat-chip class="chip-rubro" *ngFor="let r of nombresRubrosArray(p.id_Rubros)">
            {{ r }}
          </mat-chip>
          <span *ngIf="!p.id_Rubros || p.id_Rubros.length === 0" class="sin-dato">Sin rubros</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="accent" (click)="abrirFormulario(p)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmarEliminar(p)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

<app-proveedor-form *ngIf="mostrarFormulario"
                    [proveedor]="proveedorSeleccionado"
                    (guardado)="onGuardado()"
                    (cancelado)="cerrarFormulario()">
</app-proveedor-form>
