<div class="container">
  <div class="header-actions">
    <h2>Lista de Adjudicaciones</h2>
    <button mat-raised-button color="primary"
            (click)="abrirAdjudicar()"
            [disabled]="sinPedidosPendientes"
            [matTooltip]="sinPedidosPendientes ? 'No hay pedidos pendientes' : 'Adjudicar pedidos'">
      <mat-icon>gavel</mat-icon>
      Adjudicar Pedidos
    </button>
  </div>

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar adjudicación</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="ID, fecha, orden, estado...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" matSort class="tabla-mat">
      <!-- Columna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let a">{{ a.id }}</td>
      </ng-container>

      <!-- Columna Fecha Resolución -->
      <ng-container matColumnDef="fecha_Resolucion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha Resolución</th>
        <td mat-cell *matCellDef="let a">
          <mat-icon class="icon-mini">event</mat-icon>
          {{ a.fecha_Resolucion | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <!-- Columna Orden Compra -->
      <ng-container matColumnDef="orden_Compra">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Orden #</th>
        <td mat-cell *matCellDef="let a">
          <mat-chip class="chip-orden">#{{ a.orden_Compra }}</mat-chip>
        </td>
      </ng-container>

      <!-- Columna Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
        <td mat-cell *matCellDef="let a">
          <mat-chip [class]="colorEstado(a.estado)">
            {{ a.estado }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Columna Detalles -->
      <ng-container matColumnDef="detalles">
        <th mat-header-cell *matHeaderCellDef>Detalles</th>
        <td mat-cell *matCellDef="let a">
          <button mat-stroked-button color="primary"
                  (click)="verDetalle(a)"
                  matTooltip="Ver/agregar detalles">
            <mat-icon>list_alt</mat-icon>
            Ver Detalles
          </button>
        </td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let a">
          <button mat-icon-button color="accent" (click)="abrirFormulario(a)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmarEliminar(a)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

<!-- Modal para EDITAR adjudicación existente -->
<app-adjudicacion-form *ngIf="mostrarFormulario"
                       [adjudicacion]="adjudicacionSeleccionada"
                       (guardado)="onGuardado()"
                       (cancelado)="cerrarFormulario()">
</app-adjudicacion-form>

<!-- Modal de DETALLE -->
<app-detalle-adjudicacion-modal 
  *ngIf="mostrarDetalle && adjudicacionDetalle"
  [adjudicacion]="adjudicacionDetalle"
  (cerrar)="cerrarDetalle()">
</app-detalle-adjudicacion-modal>

<!-- Modal de ADJUDICAR PEDIDOS (nuevo flujo) -->
<app-adjudicar-pedidos-modal
  *ngIf="mostrarAdjudicar"
  (cerrar)="cerrarAdjudicar()"
  (adjudicado)="onAdjudicado()">
</app-adjudicar-pedidos-modal>
