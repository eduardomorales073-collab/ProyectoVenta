<div class="container">
  <div class="header-actions">
    <h2>Lista de Unidades de Medida</h2>
    <button mat-raised-button color="primary" (click)="abrirFormulario(null)">
      <mat-icon>add</mat-icon>
      Nueva Unidad
    </button>
  </div>

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar unidad</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Nombre, abreviatura o descripción...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" matSort class="tabla-mat">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let u">{{ u.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let u">{{ u.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="abreviatura">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Abreviatura</th>
        <td mat-cell *matCellDef="let u">
          <span class="chip-abrev" *ngIf="u.abreviatura; else sinAbrev">
            {{ u.abreviatura }}
          </span>
          <ng-template #sinAbrev><span class="sin-dato">—</span></ng-template>
        </td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
        <td mat-cell *matCellDef="let u">{{ u.descripcion || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="accent" (click)="abrirFormulario(u)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmarEliminar(u)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

<app-unidad-form *ngIf="mostrarFormulario"
                 [unidad]="unidadSeleccionada"
                 (guardado)="onGuardado()"
                 (cancelado)="cerrarFormulario()">
</app-unidad-form>
