<div class="container">
  <div class="header-actions">
    <h2>Lista de Departamentos</h2>
    <button mat-raised-button color="primary" (click)="abrirFormulario(null)">
      <mat-icon>add</mat-icon>
      Nuevo Departamento
    </button>
  </div>

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar departamento</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Nombre, descripción o sucursal...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" matSort class="tabla-mat">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let d">{{ d.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let d">{{ d.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
        <td mat-cell *matCellDef="let d">{{ d.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="sucursal">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sucursal</th>
        <td mat-cell *matCellDef="let d">
          <mat-chip [highlighted]="true">
            {{ nombreSucursal(d.id_Sucursal) }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let d">
          <button mat-icon-button color="accent" (click)="abrirFormulario(d)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmarEliminar(d)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

<app-departamento-form *ngIf="mostrarFormulario"
                       [departamento]="departamentoSeleccionado"
                       [sucursales]="sucursales"
                       (guardado)="onGuardado()"
                       (cancelado)="cerrarFormulario()">
</app-departamento-form>
