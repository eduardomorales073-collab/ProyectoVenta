<div class="container">
  <div class="header-actions">
    <h2>Lista de Usuarios</h2>
    <button mat-raised-button color="primary" (click)="abrirFormulario(null)">
      <mat-icon>add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <!-- Filtro de búsqueda -->
  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar usuario</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Nombre, email o rol...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <!-- Tabla Material (SIN *ngIf) -->
  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" matSort class="tabla-mat">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let u">{{ u.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let u">{{ u.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
        <td mat-cell *matCellDef="let u">
          <mat-chip [highlighted]="u.id_Rol === 1">
            {{ nombreRol(u.id_Rol) }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let u">
          <mat-chip [highlighted]="u.activo" [color]="u.activo ? 'primary' : 'warn'">
            {{ u.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="primary" (click)="verPermisos(u)" matTooltip="Ver permisos">
            <mat-icon>vpn_key</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="abrirFormulario(u)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmarEliminar(u)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
                   [pageSize]="10"
                   showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

<!-- Modales -->
<app-usuario-form *ngIf="mostrarFormulario"
                  [usuario]="usuarioSeleccionado"
                  (guardado)="onGuardado()"
                  (cancelado)="cerrarFormulario()">
</app-usuario-form>

<app-permisos-modal *ngIf="mostrarPermisos && usuarioPermisos"
                    [idUsuario]="usuarioPermisos.id"
                    [nombreUsuario]="usuarioPermisos.nombre"
                    (cerrar)="cerrarPermisos()"
                    (actualizado)="onPermisosActualizados()">
</app-permisos-modal>
