<div class="container">
  <div class="header-actions">
    <h2>Lista de Usuarios</h2>
    <button mat-raised-button color="primary" (click)="abrirFormulario(null)">
      <mat-icon>add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar usuario</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Nombre, email, rol, sucursal...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" matSort class="tabla-mat">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let u">{{ u.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let u">{{ u.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
        <td mat-cell *matCellDef="let u">
          <!-- ✅ Usamos el nuevo método getNombreRol -->
          <mat-chip [class]="claseRol(getNombreRol(u))">
            {{ getNombreRol(u) }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="asignacion">
        <th mat-header-cell *matHeaderCellDef>Asignación / Ubicación</th>
        <td mat-cell *matCellDef="let u">
          <span class="asignacion-texto">
            <mat-icon class="icon-mini" *ngIf="u.id_Proveedor">business</mat-icon>
            <mat-icon class="icon-mini" *ngIf="!u.id_Proveedor">account_tree</mat-icon>
            {{ getAsignacion(u) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let u">
          <mat-chip [class]="u.activo ? 'chip-activo' : 'chip-inactivo'">
            {{ u.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="accent" (click)="abrirFormulario(u)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmarEliminar(u)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" showFirstLastButtons></mat-paginator>
  </div>
</div>

<!-- ✅ CORREGIDO: Eliminamos [departamentos] y [proveedores] porque el formulario hijo no los recibe como @Input -->
<app-usuario-form *ngIf="mostrarFormulario"
                  [usuario]="usuarioSeleccionado"
                  (guardado)="onGuardado()"
                  (cancelado)="cerrarFormulario()">
</app-usuario-form>
