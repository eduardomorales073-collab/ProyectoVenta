<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
      <button class="close-btn" (click)="onCancelar()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" formControlName="nombre" placeholder="Ej: Juan Pérez" />
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" placeholder="juan@ejemplo.com" />
      </div>

      <div class="form-group">
        <label>Contraseña {{ esEdicion ? '(dejar vacío para no cambiar)' : '*' }}</label>
        <input type="password" formControlName="contrasena" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-group">
        <label>Rol *</label>
        <select formControlName="id_Rol">
          <option [value]="1">Administrador</option>
          <option [value]="2">Empleado</option>
          <option [value]="3">Proveedor</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="activo" />
          Usuario activo
        </label>
      </div>

      <p *ngIf="error" class="error-message">{{ error }}</p>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="form.invalid || guardando">
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
