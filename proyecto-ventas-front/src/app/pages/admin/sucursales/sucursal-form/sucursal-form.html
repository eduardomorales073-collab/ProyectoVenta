<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Sucursal' : 'Nueva Sucursal' }}</h2>
      <button mat-icon-button (click)="onCancelar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <!-- Nombre -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej: Sucursal Central" required>
        <mat-icon matPrefix>business</mat-icon>
        <mat-error *ngIf="form.get('nombre')?.hasError('required')">
          El nombre es obligatorio
        </mat-error>
        <mat-error *ngIf="form.get('nombre')?.hasError('maxlength')">
          Máximo 100 caracteres
        </mat-error>
      </mat-form-field>

      <!-- Teléfonos -->
      <div class="telefonos-section">
        <div class="telefonos-header">
          <label>Teléfonos</label>
          <button 
            mat-icon-button 
            color="primary" 
            type="button" 
            (click)="agregarTelefono()" 
            matTooltip="Agregar teléfono">
            <mat-icon>add_circle</mat-icon>
          </button>
        </div>

        <div formArrayName="telefonos" class="telefonos-list">
  <div 
    *ngFor="let tel of telefonos.controls; let i = index" 
    class="telefono-row">
    
    <mat-form-field appearance="outline" class="telefono-field">
      <mat-label>Teléfono {{ i + 1 }}</mat-label>
      <input 
        matInput 
        [formControlName]="i" 
        placeholder="Ej: 5555-1234"
        maxlength="20">
      <mat-icon matPrefix>phone</mat-icon>
      <mat-error *ngIf="telefonos.at(i).hasError('maxlength')">
        Máximo 20 caracteres
      </mat-error>
    </mat-form-field>

    <button 
      mat-icon-button 
      color="warn" 
      type="button" 
      (click)="eliminarTelefono(i)" 
      matTooltip="Eliminar teléfono">
      <mat-icon>remove_circle</mat-icon>
    </button>
  </div>
</div>
      </div>

      <!-- Botones -->
      <div class="modal-actions">
        <button mat-button type="button" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>{{ esEdicion ? 'save' : 'add' }}</mat-icon>
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
