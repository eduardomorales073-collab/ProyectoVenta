<div class="reporte-container">
  <div class="header-section">
    <button mat-icon-button [routerLink]="rutaVolver" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="header-info">
      <h1>
        <mat-icon>{{ reporte?.icono || 'assessment' }}</mat-icon>
        {{ reporte?.titulo || 'Reporte Jasper' }}
      </h1>
      <p>{{ reporte?.descripcion || 'Reporte generado con JasperReports Server' }}</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="recargar()">
        <mat-icon>refresh</mat-icon>
        Recargar
      </button>
    </div>
  </div>

  <div class="loading" *ngIf="cargando">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Cargando reporte desde JasperReports Server...</p>
  </div>

  <mat-card class="iframe-card" *ngIf="!cargando && urlSegura">
    <mat-card-content>
      <iframe
        [src]="urlSegura"
        width="100%"
        height="900"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </mat-card-content>
  </mat-card>
</div>
