<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Categoría' : 'Nueva Categoría' }}</h2>
      <button mat-icon-button (click)="onCancelar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre de la Categoría</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej: Tecnología" required>
        <mat-icon matPrefix>category</mat-icon>
        <mat-error *ngIf="form.get('nombre')?.hasError('required')">
          El nombre es obligatorio
        </mat-error>
        <mat-error *ngIf="form.get('nombre')?.hasError('maxlength')">
          Máximo 50 caracteres
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion" rows="3"
                  placeholder="Ej: Equipos de cómputo, software y electrónica"></textarea>
        <mat-icon matPrefix>description</mat-icon>
        <mat-error *ngIf="form.get('descripcion')?.hasError('maxlength')">
          Máximo 200 caracteres
        </mat-error>
      </mat-form-field>

      <div class="modal-actions">
        <button mat-button type="button" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>{{ esEdicion ? 'save' : 'add' }}</mat-icon>
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
