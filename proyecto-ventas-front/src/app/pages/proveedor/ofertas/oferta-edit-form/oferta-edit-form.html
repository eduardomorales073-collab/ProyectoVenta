<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Editar Oferta</h2>
      <button mat-icon-button (click)="onCancelar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="info-oferta" *ngIf="oferta">
      <p><strong>Oferta #:</strong> {{ oferta.id }}</p>
      <p><strong>Precio actual:</strong> Q {{ oferta.precio | number:'1.2-2' }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nuevo Precio (Q)</mat-label>
        <input matInput type="number" step="0.01" min="0.01" formControlName="precio" placeholder="Ej: 1500.00" required>
        <mat-icon matPrefix>attach_money</mat-icon>
        <mat-error *ngIf="form.get('precio')?.hasError('required')">
          El precio es obligatorio
        </mat-error>
        <mat-error *ngIf="form.get('precio')?.hasError('min')">
          El precio debe ser mayor a 0
        </mat-error>
      </mat-form-field>

      <div class="modal-actions">
        <button mat-button type="button" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>save</mat-icon>
          {{ guardando ? 'Guardando...' : 'Actualizar Oferta' }}
        </button>
      </div>
    </form>
  </div>
</div>
