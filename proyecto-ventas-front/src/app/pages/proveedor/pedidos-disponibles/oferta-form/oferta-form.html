<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <!-- ✅ Título Dinámico -->
      <h2>{{ esEdicion ? 'Mejorar Oferta' : 'Nueva Oferta' }}</h2>
      <button mat-icon-button (click)="onCancelar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="info-pedido" *ngIf="pedido || oferta">
      <p><strong>Pedido:</strong> {{ pedido?.codigo || oferta?.codigoPedido }}</p>
      <p *ngIf="pedido"><strong>Cantidad:</strong> {{ pedido.cantidad || 1 }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ esEdicion ? 'Nuevo Precio (Q)' : 'Precio de tu Oferta (Q)' }}</mat-label>
        <input matInput type="number" step="0.01" min="0.01" formControlName="precio" placeholder="Ej: 1500.00" required>
        <mat-icon matPrefix>attach_money</mat-icon>
        <mat-error *ngIf="form.get('precio')?.hasError('required')">
          El precio es obligatorio
        </mat-error>
        <mat-error *ngIf="form.get('precio')?.hasError('min')">
          El precio debe ser mayor a 0
        </mat-error>
      </mat-form-field>

      <div class="modal-actions">
        <button mat-button type="button" (click)="onCancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
          <mat-icon>{{ esEdicion ? 'trending_up' : 'send' }}</mat-icon>
          <!-- ✅ Texto Dinámico -->
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar Oferta' : 'Enviar Oferta') }}
        </button>
      </div>
    </form>
  </div>
</div>
